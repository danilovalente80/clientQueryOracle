<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle Query Client</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>Oracle Query Client</h1>
                </div>
                <div id="userInfo" style="text-align: right; display: none;">
                    <p style="margin: 0; font-size: 13px; color: rgba(255,255,255,0.8);">Logged in as</p>
                    <p style="margin: 3px 0; font-size: 15px; font-weight: bold; color: white;" id="userDisplay"></p>
                    <button onclick="logout()" style="padding: 5px 10px; background: rgba(220, 53, 69, 0.9); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">
                        Logout
                    </button>
                </div>
            </div>
        </header>

        <main>
            <!-- Database Selection -->
            <section class="card card-compact">
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="aliasSelect">Database (Optional):</label>
                    <select id="aliasSelect" class="form-control form-control-compact">
                        <option value="">-- Auto-detect from query --</option>
                        <option value="entr_asp">entr_asp (jdbc/nsd_entr)</option>
                        <option value="sesamo">sesamo (jdbc/ds_sesamo)</option>
                    </select>
                </div>
            </section>

            <!-- Query Input -->
            <section class="card">
                <div class="form-group">
                    <label for="queryInput">SQL Query (INSERT, UPDATE, DELETE):</label>
                    <textarea id="queryInput" class="form-control query-textarea" rows="12"
                        placeholder="Enter your SQL query here..."></textarea>
                </div>
                <div class="button-group-right">
                    <button id="executeBtn" class="btn btn-primary" onclick="executeQuery()">
                        <span class="btn-icon">▶</span> Execute
                    </button>
                    <button id="clearBtn" class="btn btn-secondary" onclick="clearQuery()">
                        <span class="btn-icon">✕</span> Clear
                    </button>
                    <!-- Transaction buttons appear here when pending -->
                    <div id="transactionButtons" style="display: none;">
                        <button id="commitBtn" class="btn btn-success" onclick="commitTransaction()">
                            <span class="btn-icon">✓</span> Commit
                        </button>
                        <button id="rollbackBtn" class="btn btn-danger" onclick="rollbackTransaction()">
                            <span class="btn-icon">↩</span> Rollback
                        </button>
                    </div>
                </div>
            </section>

            <!-- Results -->
            <section class="card card-compact" id="resultsSection" style="display: none;">
                <div id="resultsContent">
                    <div class="result-info-compact">
                        <div class="result-row-compact">
                            <span id="statusText" class="status-badge"></span>
                            <span class="result-separator">•</span>
                            <span class="result-label-inline">Rows:</span>
                            <span id="affectedRows" class="affected-rows-count">0</span>
                        </div>
                        <div class="result-message">
                            <span id="messageText" class="message-text"></span>
                        </div>
                        <div id="errorDetailsRow" class="result-error" style="display: none;">
                            <span id="errorDetails" class="error-details"></span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Status Indicator -->
            <div id="loadingIndicator" class="loading-indicator" style="display: none;">
                <div class="spinner"></div>
                <span>Processing...</span>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Oracle Query Client | Session ID: <span id="sessionId">-</span></p>
        </footer>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Confirm Action</h3>
            <p id="modalMessage">Are you sure?</p>
            <div class="modal-buttons">
                <button id="modalCancelBtn" class="modal-btn modal-btn-secondary">Cancel</button>
                <button id="modalConfirmBtn" class="modal-btn modal-btn-primary">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Alert Notification -->
    <div id="alertNotification" class="alert-notification">
        <span id="alertIcon" class="alert-icon">✓</span>
        <span id="alertMessage">Success!</span>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
